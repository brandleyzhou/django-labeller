<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>vue</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body>
<div id="app">
    <h1>Vue.js Example</h1>
    <p v-bind:style="{ color: condition ? 'red' : 'black'}">{{ message }}</p>
    <p v-bind:class=""></p>
    <p> {{ b + 1 }} </p>
    <button v-on:click="changeMessage">Change Message</button>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            message: 'Hello, Vue.js!',
            species_list: [
                {'A' : 'Species A'},
                {'B' : 'Species B'},
                {'C' : 'Species C'},
            ],
            condition: true,
            b: 1
        },
        methods: {
            changeMessage() {
                this.message = 'You clicked the button!';
                this.b --;
                this.condition = !this.condition;
            }
        }
    });
</script>
</body>
</html>
